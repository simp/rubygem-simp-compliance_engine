---
name: PR Tests

'on':
  push:
    branches:
      - main

  pull_request:

jobs:
  validate-versions:
    name: 'Validate Versions'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Verify versions match
        run: |
          ruby << 'RUBY'
          require "json"

          metadata_version = JSON.parse(File.read("metadata.json"))["version"]

          version_rb = File.read("lib/compliance_engine/version.rb")
          version_rb_match = version_rb.match(/VERSION\s*=\s*['"]([^'"]+)['"]/)
          raise "Could not parse version from lib/compliance_engine/version.rb" unless version_rb_match
          version_rb_version = version_rb_match[1]

          changelog_match = File.read("CHANGELOG.md").match(/^###\s+(\d+\.\d+\.\d+)/)
          raise "Could not parse version from CHANGELOG.md" unless changelog_match
          changelog_version = changelog_match[1]

          errors = []
          errors << "metadata.json (#{metadata_version}) != version.rb (#{version_rb_version})" unless metadata_version == version_rb_version
          errors << "metadata.json (#{metadata_version}) != CHANGELOG.md (#{changelog_version})" unless metadata_version == changelog_version

          if errors.empty?
            puts "All versions match: #{metadata_version}"
          else
            errors.each { |e| puts "ERROR: #{e}" }
            exit 1
          end
          RUBY

  ruby-style:
    name: 'Ruby Style'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: "Install Ruby"
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 4.0.7
          bundler-cache: true
      - run: bundle exec rake rubocop

  spec-tests:
    runs-on: ubuntu-latest
    name: Ruby ${{ matrix.ruby }} (OpenVox ${{ matrix.openvox }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - ruby: '3.2'  # OpenVox 8 agent
            openvox: '8'
          - ruby: '3.3'
            openvox: '8'
          - ruby: '3.4'
            openvox: '9'
          - ruby: '4.0'  # OpenVox 9 agent
            openvox: '9'
          - ruby: 'jruby-9.4'  # OpenVox Server 8
            openvox: '8'
          - ruby: 'jruby-10.0'  # OpenVox Server 9
            openvox: '9'
    env:
      OPENVOX_VERSION: '~> ${{ matrix.openvox }}.0'

    steps:
      - uses: actions/checkout@v7
      - name: Install native build tools (required by prism on JRuby)
        if: startsWith(matrix.ruby, 'jruby')
        run: sudo apt-get update && sudo apt-get install -y build-essential
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Spec tests
        run: bundle exec rake parallel_spec

  acceptance-apply:
    name: 'Acceptance: puppet apply (alma9, ${{ matrix.collection }})'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        collection:
          - openvox8
          - openvox9
    steps:
      - uses: actions/checkout@v7
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0.7'
      - name: Install dependencies (with acceptance group)
        run: bundle install
        env:
          BUNDLE_WITH: acceptance
      - name: Run puppet apply acceptance tests
        run: bundle exec rake acceptance:apply
        env:
          BEAKER_SETFILE: spec/acceptance/nodesets/apply.yml
          BEAKER_PUPPET_COLLECTION: ${{ matrix.collection }}
          BEAKER_HYPERVISOR: docker

  acceptance-server:
    name: 'Acceptance: puppet agent + openvox-server (alma9, ${{ matrix.collection }}, ${{ matrix.suite.label }})'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        collection:
          - openvox8
          - openvox9
        suite:
          - name: 'basic server/agent'
            spec: '02_server_agent_spec.rb'
            label: 'basic'
          - name: 'cache leakage'
            spec: '03_cache_leakage_spec.rb'
            label: 'cache'
          - name: 'environment leakage'
            spec: '04_env_leakage_spec.rb'
            label: 'env-leakage'
          - name: 'data update'
            spec: '05_data_update_spec.rb'
            label: 'data-update'
    steps:
      - uses: actions/checkout@v7
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0.7'
      - name: Install dependencies (with acceptance group)
        run: bundle install
        env:
          BUNDLE_WITH: acceptance
      - name: Run ${{ matrix.suite.name }} acceptance tests
        run: bundle exec rspec spec/acceptance/${{ matrix.suite.spec }}
        env:
          BEAKER_SETFILE: spec/acceptance/nodesets/server_agent.yml
          BEAKER_PUPPET_COLLECTION: ${{ matrix.collection }}
          BEAKER_HYPERVISOR: docker

  # The one check for branch protection to require: GitHub only blocks a
  # merge on checks listed by name, and this job fails unless every job it
  # needs succeeded. Add any new job in this workflow to `needs:`.
  all-checks:
    name: 'All checks'
    if: always()
    needs:
      - validate-versions
      - ruby-style
      - spec-tests
      - acceptance-apply
      - acceptance-server
    runs-on: ubuntu-latest
    steps:
      - name: 'Fail unless every needed job succeeded'
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"
          jq -e 'all(.[]; .result == "success")' <<< "$NEEDS" > /dev/null
